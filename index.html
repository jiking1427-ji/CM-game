<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Street Fight Karo - Arcade Brawler</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0f0c20;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      max-width: 100vw;
      height: 450px;
      max-height: 60vh;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 3px solid #ff0055;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* UI Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .health-bar-box {
      width: 40%;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid #fff;
      height: 24px;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .health-fill {
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }
    #player-health { background: linear-gradient(90deg, #00ff87, #60efff); }
    #enemy-health { background: linear-gradient(90deg, #ff0055, #ff5050); float: right; }
    .score-board {
      font-size: 18px;
      font-weight: bold;
      color: #ffcc00;
      text-shadow: 0 0 5px #000;
      text-align: center;
    }
    /* Controls Overlay for Mobile */
    .mobile-controls {
      position: absolute;
      bottom: 10px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: auto;
    }
    .d-pad, .action-btns {
      display: flex;
      gap: 10px;
    }
    .btn {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .btn:active { background: rgba(255, 0, 85, 0.6); }
    @media (min-width: 768px) {
      .mobile-controls { display: none; } /* Hide on Desktop */
    }
    .game-over-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .game-over-screen h1 { font-size: 40px; color: #ff0055; margin-bottom: 10px; }
    .restart-btn {
      padding: 12px 24px;
      font-size: 18px;
      background: #00ff87;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2 style="margin-bottom: 10px; color: #00ff87;">👊 STREET FIGHT KARO 👊</h2>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <div class="ui-layer">
      <div class="hud">
        <div class="health-bar-box"><div id="player-health" class="health-fill"></div></div>
        <div class="score-board">
          <div>SCORE: <span id="score">0</span></div>
          <div style="font-size: 12px; color: #fff;">WAVE: <span id="wave">1</span></div>
        </div>
        <div class="health-bar-box"><div id="enemy-health" class="health-fill"></div></div>
      </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="mobile-controls">
      <div class="d-pad">
        <div class="btn" id="btn-left">◄</div>
        <div class="btn" id="btn-right">►</div>
      </div>
      <div class="action-btns">
        <div class="btn" id="btn-punch" style="background: rgba(0, 255, 135, 0.4);">P</div>
        <div class="btn" id="btn-kick" style="background: rgba(255, 0, 85, 0.4);">K</div>
      </div>
    </div>

    <div id="gameOverScreen" class="game-over-screen" style="display: none;">
      <h1 id="overTitle">GAME OVER</h1>
      <p id="finalScore">Score: 0</p>
      <button class="restart-btn" onclick="restartGame()">RESTART</button>
    </div>
  </div>

  <p style="margin-top: 15px; color: #aaa; font-size: 14px;">
    <b>Controls:</b> Move: <code>A</code> / <code>D</code> or <code>◄</code> <code>►</code> | Punch: <code>J</code> / <code>Z</code> | Kick: <code>K</code> / <code>X</code>
  </p>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Audio Synthesizer (No external files needed)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(freq, duration, type = 'sine') {
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    // Game Variables
    let score = 0;
    let wave = 1;
    let gameOver = false;
    const gravity = 0.6;

    // Player Object
    const player = {
      x: 100,
      y: 300,
      width: 50,
      height: 100,
      color: '#00ff87',
      vx: 0,
      vy: 0,
      speed: 5,
      health: 100,
      maxHealth: 100,
      isAttacking: false,
      attackType: null,
      facing: 'right',
      attackBox: { x: 0, y: 0, width: 60, height: 40 }
    };

    // Enemy Object
    const enemy = {
      x: 600,
      y: 300,
      width: 50,
      height: 100,
      color: '#ff0055',
      vx: 0,
      vy: 0,
      speed: 2,
      health: 100,
      maxHealth: 100,
      isAttacking: false,
      facing: 'left',
      attackBox: { x: 0, y: 0, width: 50, height: 40 },
      attackCooldown: 0
    };

    // Keyboard Input Handler
    const keys = { a: false, d: false, ArrowLeft: false, ArrowRight: false };

    window.addEventListener('keydown', (e) => {
      if (gameOver) return;
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;

      // Attacks
      if (e.key === 'j' || e.key === 'J' || e.key === 'z' || e.key === 'Z') attack('punch');
      if (e.key === 'k' || e.key === 'K' || e.key === 'x' || e.key === 'X') attack('kick');
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
      if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
    });

    // Mobile Button Listeners
    setupMobileBtn('btn-left', () => keys.a = true, () => keys.a = false);
    setupMobileBtn('btn-right', () => keys.d = true, () => keys.d = false);
    setupMobileBtn('btn-punch', () => attack('punch'), null);
    setupMobileBtn('btn-kick', () => attack('kick'), null);

    function setupMobileBtn(id, onPress, onRelease) {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); if (onRelease) onRelease(); });
      btn.addEventListener('mousedown', onPress);
      btn.addEventListener('mouseup', () => { if (onRelease) onRelease(); });
    }

    function attack(type) {
      if (player.isAttacking) return;
      player.isAttacking = true;
      player.attackType = type;
      playSound(type === 'punch' ? 180 : 120, 0.1, 'square');

      // Check Hitbox Collision
      setTimeout(() => {
        if (checkHit(player, enemy)) {
          const damage = type === 'punch' ? 15 : 25;
          enemy.health = Math.max(0, enemy.health - damage);
          playSound(80, 0.15, 'sawtooth');
          score += 50;
          updateHUD();

          // Push enemy back
          enemy.x += player.facing === 'right' ? 30 : -30;

          if (enemy.health <= 0) {
            score += 200;
            wave++;
            resetEnemy();
          }
        }
      }, 100);

      setTimeout(() => { player.isAttacking = false; }, 300);
    }

    function checkHit(char1, char2) {
      const atkX = char1.facing === 'right' ? char1.x + char1.width : char1.x - char1.attackBox.width;
      return (
        atkX < char2.x + char2.width &&
        atkX + char1.attackBox.width > char2.x &&
        char1.y < char2.y + char2.height &&
        char1.y + char1.attackBox.height > char2.y
      );
    }

    function resetEnemy() {
      enemy.health = 100 + (wave - 1) * 20;
      enemy.maxHealth = enemy.health;
      enemy.speed = 2 + (wave * 0.3);
      enemy.x = canvas.width - 100;
      updateHUD();
    }

    function enemyAI() {
      if (gameOver) return;
      
      // Move towards player
      const dx = player.x - enemy.x;
      if (Math.abs(dx) > 40) {
        enemy.x += dx > 0 ? enemy.speed : -enemy.speed;
        enemy.facing = dx > 0 ? 'right' : 'left';
      } else {
        // Enemy Attacks when close
        if (enemy.attackCooldown <= 0) {
          enemy.isAttacking = true;
          playSound(150, 0.1, 'triangle');
          
          if (checkHit(enemy, player)) {
            player.health = Math.max(0, player.health - 10);
            playSound(60, 0.2, 'sawtooth');
            player.x += enemy.facing === 'right' ? 20 : -20;
            updateHUD();

            if (player.health <= 0) {
              endGame();
            }
          }
          enemy.attackCooldown = 60; // cooldown frames
          setTimeout(() => { enemy.isAttacking = false; }, 300);
        }
      }

      if (enemy.attackCooldown > 0) enemy.attackCooldown--;
    }

    function updateHUD() {
      document.getElementById('player-health').style.width = (player.health / player.maxHealth * 100) + '%';
      document.getElementById('enemy-health').style.width = (enemy.health / enemy.maxHealth * 100) + '%';
      document.getElementById('score').innerText = score;
      document.getElementById('wave').innerText = wave;
    }

    function update() {
      if (gameOver) return;

      // Player Movement
      if (keys.a && player.x > 0) {
        player.x -= player.speed;
        player.facing = 'left';
      }
      if (keys.d && player.x + player.width < canvas.width) {
        player.x += player.speed;
        player.facing = 'right';
      }

      enemyAI();
    }

    function drawBackground() {
      // Street Stage Ground
      ctx.fillStyle = '#1b1b2f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Floor
      ctx.fillStyle = '#162447';
      ctx.fillRect(0, 400, canvas.width, 50);

      // Neon Line
      ctx.strokeStyle = '#ff0055';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 400);
      ctx.lineTo(canvas.width, 400);
      ctx.stroke();
    }

    function drawCharacter(char) {
      // Draw Body
      ctx.fillStyle = char.color;
      ctx.fillRect(char.x, char.y, char.width, char.height);

      // Draw Head
      ctx.fillStyle = '#ffd1a9';
      ctx.fillRect(char.x + 10, char.y - 20, 30, 20);

      // Draw Attack Animation
      if (char.isAttacking) {
        ctx.fillStyle = '#ffcc00';
        const atkX = char.facing === 'right' ? char.x + char.width : char.x - char.attackBox.width;
        ctx.fillRect(atkX, char.y + 20, char.attackBox.width, 20);
      }
    }

    function gameLoop() {
      update();
      drawBackground();
      drawCharacter(player);
      drawCharacter(enemy);

      if (!gameOver) {
        requestAnimationFrame(gameLoop);
      }
    }

    function endGame() {
      gameOver = true;
      document.getElementById('gameOverScreen').style.display = 'flex';
      document.getElementById('finalScore').innerText = 'Final Score: ' + score;
    }

    function restartGame() {
      player.health = 100;
      score = 0;
      wave = 1;
      player.x = 100;
      resetEnemy();
      gameOver = false;
      document.getElementById('gameOverScreen').style.display = 'none';
      gameLoop();
    }

    // Start Game Loop
    gameLoop();
  </script>
</body>
  </html>
